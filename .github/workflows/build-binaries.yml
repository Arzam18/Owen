name: build portable engine binaries

on:
  workflow_dispatch:
    inputs:
      net_url:
        description: "URL of the .o2nn net to bake into the binaries"
        default: "https://github.com/Owen-Foundation/Owen/releases/download/v2.1.0/owen2-v14.o2nn"
        required: false
  push:
    branches: [main, v2.0.0]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            tag: linux-x86_64
            cmake: -DOWEN_NATIVE=OFF -DOWEN_AVX2=ON
          - name: linux-arm64
            os: ubuntu-22.04-arm
            tag: linux-arm64
            cmake: -DOWEN_NATIVE=OFF
          - name: darwin-arm64 (Apple Silicon / M-chip)
            os: macos-14
            tag: darwin-arm64
            cmake: -DOWEN_NATIVE=OFF
          - name: darwin-x86_64 (Intel Macs)
            os: macos-15-intel
            tag: darwin-x86_64
            cmake: -DOWEN_NATIVE=OFF -DOWEN_AVX2=ON
          - name: windows-x86_64
            os: windows-2022
            tag: windows-x86_64
            cmake: -DOWEN_NATIVE=OFF -DOWEN_AVX2=ON
          - name: windows-arm64
            os: windows-11-arm
            tag: windows-arm64
            cmake: -DOWEN_NATIVE=OFF
          - name: linux-riscv64 (cross + qemu)
            os: ubuntu-22.04
            tag: linux-riscv64
            cmake: -DOWEN_NATIVE=OFF -DCMAKE_CXX_COMPILER=/usr/bin/riscv64-linux-gnu-g++ -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY
            apt: "gcc-riscv64-linux-gnu qemu-user"
            run_prefix: "qemu-riscv64 -L /usr/riscv64-linux-gnu"
          - name: linux-arm32 (armv7 cross + qemu)
            os: ubuntu-22.04
            tag: linux-arm32
            cmake: -DOWEN_NATIVE=OFF -DCMAKE_CXX_COMPILER=/usr/bin/arm-linux-gnueabihf-g++ -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY
            apt: "gcc-arm-linux-gnueabihf qemu-user"
            run_prefix: "qemu-arm -L /usr/arm-linux-gnueabihf"

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: install cross toolchain (if needed)
        if: matrix.apt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ${{ matrix.apt }}
          echo "PATH=$PATH"
          ls -la /usr/bin/*-linux-gnu-g++ 2>/dev/null || echo "NO cross g++ in /usr/bin"

      - name: fetch net (bake into binary)
        shell: bash
        run: |
          NET_URL="${{ inputs.net_url }}"
          if [ -n "$NET_URL" ]; then
            mkdir -p nets
            curl -sSL --max-time 300 -o nets/baked.o2nn "$NET_URL" \
              && ls -la nets/baked.o2nn \
              || echo "net download failed - building without embedded net"
          else
            echo "no net_url input - building without embedded net"
          fi

      - name: configure
        shell: bash
        run: |
          EXTRA=""
          if [ -f nets/baked.o2nn ]; then
            EXTRA="-DOWEN_EMBED_NET=1 -DOWEN_EMBED_NET_PATH=nets/baked.o2nn"
          fi
          cmake -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake }} $EXTRA

      - name: build
        run: |
          cmake --build build --target owen2 -j2 --config Release

      - name: package (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp build/owen2 "dist/owen2-${{ matrix.tag }}"

      - name: package (windows)
        if: runner.os == 'Windows'
        run: |
          mkdir dist
          copy "build\Release\owen2.exe" "dist\owen2-${{ matrix.tag }}.exe"

      - name: smoke test (bench signature, unix)
        if: runner.os != 'Windows' && hashFiles('nets/baked.o2nn') != ''
        timeout-minutes: 40
        run: |
          ${{ matrix.run_prefix }} ./dist/owen2-${{ matrix.tag }} bench 6 | tee bench.log
          grep -q "nodes 32000" bench.log && grep -q "bestmove e2e4" bench.log

      - name: smoke test (bench signature, windows)
        if: runner.os == 'Windows' && hashFiles('nets/baked.o2nn') != ''
        timeout-minutes: 15
        shell: pwsh
        run: |
          .\dist\owen2-${{ matrix.tag }}.exe bench 6 | Tee-Object bench.log
          if (-not (Select-String -Path bench.log -Pattern "nodes 32000" -Quiet)) { exit 1 }
          if (-not (Select-String -Path bench.log -Pattern "bestmove e2e4" -Quiet)) { exit 1 }

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: owen2-${{ matrix.tag }}
          path: dist/*
          retention-days: 90